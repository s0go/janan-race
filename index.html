<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>장안고 축제 - 구불구불 커브 레이싱 4</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }
        body {
            background-color: #0b0f19;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            color: #fff;
        }
        #game-container {
            position: relative;
            width: 440px;
            height: 680px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.8), 0 0 20px rgba(0, 240, 255, 0.2);
            border-radius: 20px;
            overflow: hidden;
            background: #111827;
            border: 2px solid rgba(255, 255, 255, 0.1);
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
        }
        .hud {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(15, 23, 42, 0.75);
            padding: 12px 20px;
            border-radius: 16px;
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .hud-item {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .hud-label {
            font-size: 11px;
            color: #94a3b8;
            letter-spacing: 1.5px;
            font-weight: 700;
        }
        .hud-value {
            font-size: 24px;
            font-weight: 900;
            color: #00f0ff;
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
            font-family: monospace;
        }
        .screen-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(11, 15, 25, 0.88);
            backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: auto;
            text-align: center;
            padding: 30px;
        }
        .hidden {
            display: none !important;
        }
        h1 {
            font-size: 32px;
            font-weight: 900;
            margin-bottom: 12px;
            background: linear-gradient(135deg, #00f0ff, #7000ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        p {
            font-size: 14px;
            color: #94a3b8;
            margin-bottom: 25px;
            line-height: 1.6;
        }
        .btn {
            background: linear-gradient(135deg, #00f0ff, #7000ff);
            color: white;
            border: none;
            padding: 16px 40px;
            font-size: 18px;
            font-weight: 800;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 6px 25px rgba(0, 240, 255, 0.35);
            transition: all 0.15s ease;
        }
        .btn:active {
            transform: scale(0.95);
            box-shadow: 0 2px 10px rgba(0, 240, 255, 0.2);
        }
        .result-box {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 20px 30px;
            margin-bottom: 25px;
            width: 100%;
        }
        .result-row {
            display: flex;
            justify-content: space-between;
            margin: 10px 0;
            font-size: 16px;
        }
        .result-val {
            font-weight: 800;
            color: #ff0055;
            font-family: monospace;
            font-size: 18px;
        }
        .controls-hint {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
        }
        .key-badge {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: bold;
            color: #00f0ff;
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas" width="440" height="680"></canvas>

    <div class="ui-layer">
        <div class="hud">
            <div class="hud-item">
                <span class="hud-label">RECORD TIME</span>
                <span id="time-display" class="hud-value">00.00s</span>
            </div>
            <div class="hud-item">
                <span class="hud-label">SPEED</span>
                <span id="speed-display" class="hud-value">0 KM/H</span>
            </div>
        </div>
    </div>

    <!-- 시작 화면 -->
    <div id="start-screen" class="screen-overlay">
        <h1>Jangan Racing 4</h1>
        <p>구불구불 커브 서킷을 이탈하지 말고<br>최대한 오랫동안 버텨라!</p>
        
        <div class="controls-hint">
            <span class="key-badge">◀ / A : 좌회전</span>
            <span class="key-badge">▶ / D : 우회전</span>
        </div>

        <button class="btn" onclick="startGame()">레이스 시작</button>
    </div>

    <!-- 게임 오버 화면 -->
    <div id="gameover-screen" class="screen-overlay hidden">
        <h1 style="background: linear-gradient(135deg, #ff0055, #ff5500); -webkit-background-clip: text;">CRASHED!</h1>
        <p>코스를 이탈하거나 가드레일에 충돌했습니다!</p>
        
        <div class="result-box">
            <div class="result-row">
                <span>기록 시간:</span>
                <span id="final-time" class="result-val">00.00초</span>
            </div>
            <div class="result-row">
                <span>주행 거리:</span>
                <span id="final-dist" class="result-val" style="color: #00f0ff;">0m</span>
            </div>
        </div>
        <button class="btn" onclick="startGame()">다시 도전</button>
    </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

const timeDisplay = document.getElementById('time-display');
const speedDisplay = document.getElementById('speed-display');
const startScreen = document.getElementById('start-screen');
const gameoverScreen = document.getElementById('gameover-screen');
const finalTime = document.getElementById('final-time');
const finalDist = document.getElementById('final-dist');

let gameState = 'START';
let startTime = 0;
let elapsedTime = 0;
let animationFrameId;

// 조작 상태
const keys = { Left: false, Right: false };

// 차량 설정
const car = {
    x: 220,
    y: 520,
    width: 26,
    height: 48,
    speed: 7.5,
    driftSpeed: 5.2
};

// 도로 커브 파라미터 (구불구불 맵 구현)
let mapOffset = 0;
const roadWidth = 170; // 도로 폭

// 사인파 조합으로 구불구불한 트랙의 중심 X좌표 반환
function getRoadCenter(y) {
    const worldY = mapOffset + y;
    return 220 
        + Math.sin(worldY * 0.006) * 110 
        + Math.sin(worldY * 0.015) * 50
        + Math.cos(worldY * 0.003) * 30;
}

// 키 입력 이벤트
window.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.Left = true;
    if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.Right = true;
});

window.addEventListener('keyup', (e) => {
    if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.Left = false;
    if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.Right = false;
});

// 터치 조작 지원 (모바일/마우스)
let touchStartX = 0;
canvas.addEventListener('touchstart', (e) => {
    touchStartX = e.touches[0].clientX;
}, { passive: true });

canvas.addEventListener('touchmove', (e) => {
    if (gameState !== 'PLAYING') return;
    const touchX = e.touches[0].clientX;
    const diff = touchX - touchStartX;
    if (diff < -10) { keys.Left = true; keys.Right = false; }
    else if (diff > 10) { keys.Right = true; keys.Left = false; }
    else { keys.Left = false; keys.Right = false; }
}, { passive: true });

canvas.addEventListener('touchend', () => {
    keys.Left = false;
    keys.Right = false;
});

function startGame() {
    car.x = 220;
    mapOffset = 0;
    startTime = Date.now();
    elapsedTime = 0;
    keys.Left = false;
    keys.Right = false;

    timeDisplay.innerText = '00.00s';
    speedDisplay.innerText = '180 KM/H';

    startScreen.classList.add('hidden');
    gameoverScreen.classList.add('hidden');

    gameState = 'PLAYING';

    cancelAnimationFrame(animationFrameId);
    gameLoop();
}

function gameOver() {
    gameState = 'GAMEOVER';
    const seconds = (elapsedTime / 1000).toFixed(2);
    const distance = Math.floor(mapOffset * 0.4);
    
    finalTime.innerText = `${seconds}초`;
    finalDist.innerText = `${distance}m`;
    gameoverScreen.classList.remove('hidden');
}

function update() {
    if (gameState !== 'PLAYING') return;

    // 시간 측정 (ms 단위)
    elapsedTime = Date.now() - startTime;
    timeDisplay.innerText = `${(elapsedTime / 1000).toFixed(2)}s`;

    // 시간에 따라 조금각 속도 증가
    const currentSpeed = car.speed + (elapsedTime / 10000);
    speedDisplay.innerText = `${Math.floor(currentSpeed * 24)} KM/H`;

    // 차량 이동
    if (keys.Left) car.x -= car.driftSpeed;
    if (keys.Right) car.x += car.driftSpeed;

    // 트랙 진행 (화면이 아래로 내려감)
    mapOffset += currentSpeed;

    // 현재 차 위치에서의 도로 중심값 및 좌우 가드레일 경계값
    const roadCenter = getRoadCenter(car.y);
    const leftBoundary = roadCenter - (roadWidth / 2);
    const rightBoundary = roadCenter + (roadWidth / 2);

    // 충돌 판정 (차량이 도로 밖으로 완전히 벗어나면 crash)
    const carLeft = car.x - (car.width / 2);
    const carRight = car.x + (car.width / 2);

    if (carLeft < leftBoundary || carRight > rightBoundary) {
        gameOver();
    }
}

function draw() {
    // 잔디/외곽 배경
    ctx.fillStyle = '#0f172a';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // 구불구불한 아스팔트 도로 그리기
    for (let y = 0; y < canvas.height; y += 4) {
        const roadCenter = getRoadCenter(y);
        const left = roadCenter - (roadWidth / 2);

        // 아스팔트 본체
        ctx.fillStyle = '#1e293b';
        ctx.fillRect(left, y, roadWidth, 4);

        // 연석/가드레일 (빨강/흰색 체크 패턴)
        const isRed = Math.floor((mapOffset + y) / 20) % 2 === 0;
        ctx.fillStyle = isRed ? '#ff0055' : '#ffffff';
        ctx.fillRect(left - 8, y, 8, 4);
        ctx.fillRect(left + roadWidth, y, 8, 4);

        // 도로 중앙 점선
        if (Math.floor((mapOffset + y) / 30) % 2 === 0) {
            ctx.fillStyle = '#facc15';
            ctx.fillRect(roadCenter - 2, y, 4, 4);
        }
    }

    // 레이싱 카 그리기
    ctx.save();
    ctx.translate(car.x, car.y);

    // 조향 각도 연출
    let steerAngle = 0;
    if (keys.Left) steerAngle = -0.15;
    if (keys.Right) steerAngle = 0.15;
    ctx.rotate(steerAngle);

    // 차체 그림자
    ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
    ctx.fillRect(-car.width / 2 + 4, -car.height / 2 + 6, car.width, car.height);

    // 바퀴 4개
    ctx.fillStyle = '#000000';
    ctx.fillRect(-car.width / 2 - 2, -car.height / 2 + 6, 4, 10); // 전좌
    ctx.fillRect(car.width / 2 - 2, -car.height / 2 + 6, 4, 10);  // 전우
    ctx.fillRect(-car.width / 2 - 2, car.height / 2 - 16, 4, 10); // 후좌
    ctx.fillRect(car.width / 2 - 2, car.height / 2 - 16, 4, 10);  // 후우

    // 메인 스포츠카 바디 (스포츠 레드)
    ctx.fillStyle = '#ff0055';
    ctx.beginPath();
    ctx.roundRect(-car.width / 2, -car.height / 2, car.width, car.height, 6);
    ctx.fill();

    // 유선형 데칼 (스포츠 라인)
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(-2, -car.height / 2, 4, car.height);

    // 앞/뒤 유리창
    ctx.fillStyle = '#00f0ff';
    ctx.fillRect(-car.width / 2 + 4, -car.height / 2 + 12, car.width - 8, 10); // 앞유리
    ctx.fillStyle = '#111827';
    ctx.fillRect(-car.width / 2 + 5, car.height / 2 - 14, car.width - 10, 6);  // 뒷유리

    // 헤드라이트 (네온 옐로우)
    ctx.fillStyle = '#facc15';
    ctx.fillRect(-car.width / 2 + 2, -car.height / 2, 5, 3);
    ctx.fillRect(car.width / 2 - 7, -car.height / 2, 5, 3);

    ctx.restore();
}

function gameLoop() {
    update();
    draw();
    if (gameState === 'PLAYING') {
        animationFrameId = requestAnimationFrame(gameLoop);
    }
}

// 초기 1회 렌더링
draw();
</script>

</body>
</html>
