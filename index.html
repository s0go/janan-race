<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jangan 2P Free-Move Racing</title>
<link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700&display=swap" rel="stylesheet">
<style>
body {
    margin: 0; min-height: 100vh; background: #090d16;
    display: flex; justify-content: center; align-items: center; font-family: 'Pretendard', sans-serif;
}
#gameBox {
    position: relative; width: min(1200px, 96vw); aspect-ratio: 16/9;
    overflow: hidden; border: 3px solid rgba(250, 204, 21, 0.4); border-radius: 20px; background: #1e293b;
    box-shadow: 0 20px 40px rgba(0,0,0,0.6);
}
canvas { width: 100%; height: 100%; display: block; }
#uiTop { 
    position: absolute; top: 20px; left: 25px; right: 25px; display: flex; justify-content: space-between;
    color: white; font-size: 22px; font-weight: 700; text-shadow: 0 2px 6px rgba(0,0,0,0.5); z-index: 5;
}
.p1-info { color: #38bdf8; }
.p2-info { color: #f43f5e; }
#menu { position: absolute; inset: 0; display: flex; justify-content: center; align-items: center; z-index: 10; backdrop-filter: blur(6px); background: rgba(0,0,0,0.6); }
.panel { 
    width: min(500px, 92%); padding: 30px; background: rgba(15, 23, 42, 0.95); 
    border: 1px solid rgba(255,255,255,0.1); border-radius: 24px; color: white; text-align: center;
    box-shadow: 0 15px 35px rgba(0,0,0,0.5);
}
.panel h1 { font-size: 28px; font-weight: 700; margin: 0 0 8px; color: #facc15; letter-spacing: -1px; }
.panel p { font-size: 14px; color: #94a3b8; margin: 0 0 20px; line-height: 1.5; }
button { 
    width: 100%; border: none; padding: 14px; border-radius: 12px; background: #facc15; color: #0f172a; 
    font-size: 16px; font-weight: 700; cursor: pointer; transition: all 0.2s; box-shadow: 0 4px 12px rgba(250,204,21,0.3);
}
button:hover { background: #fde047; transform: translateY(-1px); }

/* 플레이어 컨트롤 선택 가이드 스타일 */
.controls-guide { display: flex; gap: 12px; margin-bottom: 20px; text-align: center; }
.p1-card { 
    flex: 1; padding: 14px; border-radius: 16px; background: rgba(56, 189, 248, 0.15); 
    border: 2px solid #38bdf8; color: #e0f2fe; 
}
.p2-card { 
    flex: 1; padding: 14px; border-radius: 16px; background: rgba(244, 63, 94, 0.15); 
    border: 2px solid #f43f5e; color: #ffe4e6; 
}
.card-title { font-weight: 800; font-size: 16px; margin-bottom: 6px; }
.p1-card .card-title { color: #38bdf8; }
.p2-card .card-title { color: #f43f5e; }
.key-badge { display: inline-block; padding: 4px 8px; background: rgba(0,0,0,0.4); border-radius: 6px; font-weight: 700; font-size: 13px; margin-top: 4px; }
</style>
</head>
<body>

<div id="gameBox">
    <canvas id="game" width="1200" height="675"></canvas>
    <div id="uiTop">
        <div class="p1-info">P1 (파랑) LAP: <span id="p1Lap">1</span>/3</div>
        <div class="p2-info">P2 (빨강) LAP: <span id="p2Lap">1</span>/3</div>
    </div>
    <div id="menu"></div>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const p1LapEl = document.getElementById("p1Lap");
const p2LapEl = document.getElementById("p2Lap");
const menu = document.getElementById("menu");

let state = "START";

let p1 = { x: 180, y: 220, vx: 0, vy: 0, speed: 0.4, friction: 0.93, maxSpeed: 7, lap: 1, color: "#38bdf8", name: "PLAYER 1 (파랑)", stunUntil: 0 };
let p2 = { x: 180, y: 450, vx: 0, vy: 0, speed: 0.4, friction: 0.93, maxSpeed: 7, lap: 1, color: "#f43f5e", name: "PLAYER 2 (빨강)", stunUntil: 0 };

let keys = {};
window.addEventListener("keydown", e => { keys[e.code] = true; });
window.addEventListener("keyup", e => { keys[e.code] = false; });

function showMenu(winnerName = "") {
    menu.style.display = "flex";
    if(state === "START") {
        menu.innerHTML = `
            <div class="panel">
                <h1>🏎️ JANGAN 2P CIRCUIT</h1>
                <p>벽에 박으면 1초, 서로 박으면 1.5초 기절(노랑 ⚡)!<br>각자 조종할 플레이어를 확인하세요.</p>
                
                <div class="controls-guide">
                    <div class="p1-card">
                        <div class="card-title">🟦 P1 (파랑)</div>
                        <div class="key-badge">W A S D</div>
                        <div style="font-size:12px; margin-top:4px; opacity:0.8;">상 / 좌 / 하 / 우</div>
                    </div>
                    <div class="p2-card">
                        <div class="card-title">🟥 P2 (빨강)</div>
                        <div class="key-badge">↑ ← ↓ →</div>
                        <div style="font-size:12px; margin-top:4px; opacity:0.8;">방향키 (상하좌우)</div>
                    </div>
                </div>

                <button onclick="startGame()">레이스 시작!</button>
            </div>
        `;
    } else {
        menu.innerHTML = `
            <div class="panel">
                <h1>🏆 최종 승리!</h1>
                <p style="font-size:22px; color:#facc15; font-weight:700; margin:15px 0;">${winnerName} 승리!</p>
                <button onclick="startGame()">다시 레이스</button>
            </div>
        `;
    }
}

function startGame() {
    menu.style.display = "none";
    p1.x = 180; p1.y = 220; p1.vx = 0; p1.vy = 0; p1.lap = 1; p1.stunUntil = 0;
    p2.x = 180; p2.y = 450; p2.vx = 0; p2.vy = 0; p2.lap = 1; p2.stunUntil = 0;
    state = "PLAYING";
}

function triggerStun(car, duration, bounceX, bounceY) {
    let now = Date.now();
    car.stunUntil = now + duration;
    car.vx = 0; 
    car.vy = 0;
    // 끼임 방지를 위해 부딪힌 방향 반대로 튕겨냄
    car.x += bounceX;
    car.y += bounceY;
}

function update() {
    if(state !== "PLAYING") return;

    let now = Date.now();

    // --- P1 조작 ---
    if(now > p1.stunUntil) {
        if(keys["KeyW"]) p1.vy -= p1.speed;
        if(keys["KeyS"]) p1.vy += p1.speed;
        if(keys["KeyA"]) p1.vx -= p1.speed;
        if(keys["KeyD"]) p1.vx += p1.speed;
    }

    // --- P2 조작 ---
    if(now > p2.stunUntil) {
        if(keys["ArrowUp"]) p2.vy -= p2.speed;
        if(keys["ArrowDown"]) p2.vy += p2.speed;
        if(keys["ArrowLeft"]) p2.vx -= p2.speed;
        if(keys["ArrowRight"]) p2.vx += p2.speed;
    }

    // 마찰력 및 위치 이동
    p1.vx *= p1.friction; p1.vy *= p1.friction;
    p2.vx *= p2.friction; p2.vy *= p2.friction;

    p1.x += p1.vx; p1.y += p1.vy;
    p2.x += p2.vx; p2.y += p2.vy;

    // --- 1. 외곽 벽 충돌 (1초 기절 + 반사 튕김) ---
    const minX = 40, maxX = 1160, minY = 80, maxY = 635;
    
    [p1, p2].forEach(car => {
        if(car.x < minX) triggerStun(car, 1000, 15, 0);
        if(car.x > maxX) triggerStun(car, 1000, -15, 0);
        if(car.y < minY) triggerStun(car, 1000, 0, 15);
        if(car.y > maxY) triggerStun(car, 1000, 0, -15);
    });

    // --- 2. 중앙 섬 충돌 (1초 기절 + 밀쳐내기 튕김) ---
    const inner = { x: 300, y: 150, w: 600, h: 375 };
    [p1, p2].forEach(car => {
        if(car.x > inner.x && car.x < inner.x + inner.w && car.y > inner.y && car.y < inner.y + inner.h) {
            // 어느 쪽으로 들어왔는지 계산해서 튕겨냄
            let dxLeft = Math.abs(car.x - inner.x);
            let dxRight = Math.abs(car.x - (inner.x + inner.w));
            let dyTop = Math.abs(car.y - inner.y);
            let dyBottom = Math.abs(car.y - (inner.y + inner.h));
            let minDist = Math.min(dxLeft, dxRight, dyTop, dyBottom);

            if(minDist === dxLeft) triggerStun(car, 1000, -15, 0);
            else if(minDist === dxRight) triggerStun(car, 1000, 15, 0);
            else if(minDist === dyTop) triggerStun(car, 1000, 0, -15);
            else triggerStun(car, 1000, 0, 15);
        }
    });

    // --- 3. 서로 충돌 (1.5초 기절 + 밀쳐내기) ---
    let distBetween = Math.hypot(p1.x - p2.x, p1.y - p2.y);
    if(distBetween < 42) {
        let angle = Math.atan2(p2.y - p1.y, p2.x - p1.x);
        triggerStun(p1, 1500, -Math.cos(angle) * 15, -Math.sin(angle) * 15);
        triggerStun(p2, 1500, Math.cos(angle) * 15, Math.sin(angle) * 15);
    }

    p1LapEl.textContent = p1.lap;
    p2LapEl.textContent = p2.lap;

    if(p1.lap > 3) { state = "GAMEOVER"; showMenu(p1.name); }
    if(p2.lap > 3) { state = "GAMEOVER"; showMenu(p2.name); }
}

let p1Passed = false;
let p2Passed = false;

function checkLaps() {
    if(state !== "PLAYING") return;
    if(p1.x > 950) p1Passed = true;
    if(p1Passed && p1.x < 250) { p1.lap++; p1Passed = false; }

    if(p2.x > 950) p2Passed = true;
    if(p2Passed && p2.x < 250) { p2.lap++; p2Passed = false; }
}

function drawCar(car) {
    let now = Date.now();
    let isStunned = now < car.stunUntil;

    ctx.save();
    ctx.translate(car.x, car.y);
    let angle = Math.atan2(car.vy, car.vx);
    if(Math.hypot(car.vx, car.vy) < 0.1) angle = 0;
    ctx.rotate(angle);

    // 차 본체
    ctx.fillStyle = car.color;
    ctx.beginPath();
    ctx.roundRect(-24, -14, 48, 28, 8);
    ctx.fill();
    ctx.fillStyle = "#ffffff"; ctx.fillRect(16, -10, 6, 5); ctx.fillRect(16, 5, 6, 5);

    // 노란색 기절 ⚡ 및 반짝임 효과 연출
    if(isStunned) {
        ctx.strokeStyle = "#facc15"; // 노란색 테두리
        ctx.lineWidth = 4;
        ctx.strokeRect(-26, -16, 52, 32);

        // 노랑 번개 아이콘 텍스트 표시
        ctx.rotate(-angle); // 번개는 정방향으로 띄우기
        ctx.fillStyle = "#facc15";
        ctx.font = "bold 24px Pretendard";
        ctx.textAlign = "center";
        ctx.fillText("⚡", 0, -22);
    }

    ctx.restore();
}

function draw() {
    ctx.clearRect(0, 0, 1200, 675);

    // 트랙 아스팔트
    ctx.fillStyle = "#0f172a"; ctx.fillRect(0, 0, 1200, 675);

    // 넓은 중앙 구조물
    ctx.fillStyle = "#1e293b";
    ctx.beginPath();
    ctx.roundRect(300, 150, 600, 375, 50);
    ctx.fill();
    ctx.strokeStyle = "rgba(255,255,255,0.08)";
    ctx.lineWidth = 4;
    ctx.stroke();

    // 결승선
    ctx.strokeStyle = "#facc15";
    ctx.lineWidth = 8;
    ctx.setLineDash([12, 12]);
    ctx.beginPath();
    ctx.moveTo(250, 100); ctx.lineTo(250, 270);
    ctx.stroke();
    ctx.setLineDash([]);

    // 자동차 그리기
    drawCar(p1);
    drawCar(p2);
}

function loop() {
    update();
    checkLaps();
    draw();
    requestAnimationFrame(loop);
}

showMenu();
loop();
</script>
</body>
</html>
