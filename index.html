<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jangan 2P Free-Move Racing</title>
<link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700&display=swap" rel="stylesheet">
<style>
body {
    margin: 0; min-height: 100vh; background: #090d16;
    display: flex; justify-content: center; align-items: center; font-family: 'Pretendard', sans-serif;
}
#gameBox {
    position: relative; width: min(900px, 95vw); aspect-ratio: 16/9;
    overflow: hidden; border: 3px solid rgba(250, 204, 21, 0.4); border-radius: 20px; background: #1e293b;
    box-shadow: 0 20px 40px rgba(0,0,0,0.6);
}
canvas { width: 100%; height: 100%; display: block; }
#uiTop { 
    position: absolute; top: 15px; left: 20px; right: 20px; display: flex; justify-content: space-between;
    color: white; font-size: 20px; font-weight: 700; text-shadow: 0 2px 6px rgba(0,0,0,0.5); z-index: 5;
}
.p1-info { color: #38bdf8; }
.p2-info { color: #f43f5e; }
#menu { position: absolute; inset: 0; display: flex; justify-content: center; align-items: center; z-index: 10; backdrop-filter: blur(4px); background: rgba(0,0,0,0.5); }
.panel { 
    width: min(420px, 90%); padding: 30px; background: rgba(15, 23, 42, 0.95); 
    border: 1px solid rgba(255,255,255,0.1); border-radius: 24px; color: white; text-align: center;
    box-shadow: 0 15px 35px rgba(0,0,0,0.5);
}
.panel h1 { font-size: 26px; font-weight: 700; margin: 0 0 10px; color: #facc15; letter-spacing: -1px; }
.panel p { font-size: 14px; color: #94a3b8; margin: 0 0 20px; line-height: 1.5; }
button { 
    width: 100%; border: none; padding: 14px; border-radius: 12px; background: #facc15; color: #0f172a; 
    font-size: 16px; font-weight: 700; cursor: pointer; transition: all 0.2s; box-shadow: 0 4px 12px rgba(250,204,21,0.3);
}
button:hover { background: #fde047; transform: translateY(-1px); }
.controls-guide { display: flex; justify-content: space-around; margin-bottom: 20px; font-size: 13px; color: #cbd5e1; background: rgba(255,255,255,0.05); padding: 12px; border-radius: 12px; text-align: left; }
.controls-guide div b { display: block; margin-bottom: 4px; font-size: 14px; color: #facc15; }
</style>
</head>
<body>

<div id="gameBox">
    <canvas id="game" width="900" height="506"></canvas>
    <div id="uiTop">
        <div class="p1-info">P1 LAP: <span id="p1Lap">1</span>/3</div>
        <div class="p2-info">P2 LAP: <span id="p2Lap">1</span>/3</div>
    </div>
    <div id="menu"></div>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const p1LapEl = document.getElementById("p1Lap");
const p2LapEl = document.getElementById("p2Lap");
const menu = document.getElementById("menu");

let state = "START";

// 탑뷰 차량 객체 (상하좌우 자유 이동)
let p1 = { x: 150, y: 180, vx: 0, vy: 0, speed: 0.35, friction: 0.92, maxSpeed: 6, lap: 1, color: "#38bdf8", name: "PLAYER 1" };
let p2 = { x: 150, y: 320, vx: 0, vy: 0, speed: 0.35, friction: 0.92, maxSpeed: 6, lap: 1, color: "#f43f5e", name: "PLAYER 2" };

let keys = {};
window.addEventListener("keydown", e => { keys[e.code] = true; });
window.addEventListener("keyup", e => { keys[e.code] = false; });

function showMenu(winnerName = "") {
    menu.style.display = "flex";
    if(state === "START") {
        menu.innerHTML = `
            <div class="panel">
                <h1>🏎️ JANGAN 2P CIRCUIT</h1>
                <p>사방으로 질주하여 먼저 3바퀴를 도는 사람이 승리!</p>
                <div class="controls-guide">
                    <div><b>P1 (파랑)</b>W A S D 키<br>(상하좌우 이동)</div>
                    <div><b>P2 (빨강)</b>방향키 (↑ ↓ ← →)<br>(상하좌우 이동)</div>
                </div>
                <button onclick="startGame()">레이스 시작!</button>
            </div>
        `;
    } else {
        menu.innerHTML = `
            <div class="panel">
                <h1>🏆 최종 승리!</h1>
                <p style="font-size:22px; color:#facc15; font-weight:700; margin:15px 0;">${winnerName} 승리!</p>
                <button onclick="startGame()">다시 레이스</button>
            </div>
        `;
    }
}

function startGame() {
    menu.style.display = "none";
    p1.x = 150; p1.y = 180; p1.vx = 0; p1.vy = 0; p1.lap = 1;
    p2.x = 150; p2.y = 320; p2.vx = 0; p2.vy = 0; p2.lap = 1;
    state = "PLAYING";
}

function update() {
    if(state !== "PLAYING") return;

    // --- P1 조작 (WASD) ---
    if(keys["KeyW"]) p1.vy -= p1.speed;
    if(keys["KeyS"]) p1.vy += p1.speed;
    if(keys["KeyA"]) p1.vx -= p1.speed;
    if(keys["KeyD"]) p1.vx += p1.speed;

    // --- P2 조작 (방향키) ---
    if(keys["ArrowUp"]) p2.vy -= p2.speed;
    if(keys["ArrowDown"]) p2.vy += p2.speed;
    if(keys["ArrowLeft"]) p2.vx -= p2.speed;
    if(keys["ArrowRight"]) p2.vx += p2.speed;

    // 마찰력 적용 및 속도 제한
    p1.vx *= p1.friction; p1.vy *= p1.friction;
    p2.vx *= p2.friction; p2.vy *= p2.friction;

    // 최대 속도 클램핑
    let p1Mag = Math.hypot(p1.vx, p1.vy);
    if(p1Mag > p1.maxSpeed) { p1.vx = (p1.vx / p1Mag) * p1.maxSpeed; p1.vy = (p1.vy / p1Mag) * p1.maxSpeed; }
    let p2Mag = Math.hypot(p2.vx, p2.vy);
    if(p2Mag > p2.maxSpeed) { p2.vx = (p2.vx / p2Mag) * p2.maxSpeed; p2.vy = (p2.vy / p2Mag) * p2.maxSpeed; }

    p1.x += p1.vx; p1.y += p1.vy;
    p2.x += p2.vx; p2.y += p2.vy;

    // 경기장 벽 충돌 처리 (화면 밖으로 못 나가게)
    const margin = 30;
    if(p1.x < margin) { p1.x = margin; p1.vx *= -0.5; }
    if(p1.x > 900 - margin) { p1.x = 900 - margin; p1.vx *= -0.5; }
    if(p1.y < margin + 30) { p1.y = margin + 30; p1.vy *= -0.5; }
    if(p1.y > 506 - margin) { p1.y = 506 - margin; p1.vy *= -0.5; }

    if(p2.x < margin) { p2.x = margin; p2.vx *= -0.5; }
    if(p2.x > 900 - margin) { p2.x = 900 - margin; p2.vx *= -0.5; }
    if(p2.y < margin + 30) { p2.y = margin + 30; p2.vy *= -0.5; }
    if(p2.y > 506 - margin) { p2.y = 506 - margin; p2.vy *= -0.5; }

    // 심플한 랩(Lap) 체크 (왼쪽 결승선을 통과할 때마다 카운트)
    // 간단히 x좌표 200선을 오른쪽으로 넘었다가 다시 왼쪽으로 돌아오면 1랩 증가하도록 구현
    p1LapEl.textContent = p1.lap;
    p2LapEl.textContent = p2.lap;

    if(p1.lap > 3) { state = "GAMEOVER"; showMenu(p1.name); }
    if(p2.lap > 3) { state = "GAMEOVER"; showMenu(p2.name); }
}

// 랩 카운트를 위한 임시 트리거 관리
let p1Passed = false;
let p2Passed = false;

function checkLaps() {
    if(state !== "PLAYING") return;
    // 중앙 트랙 코너를 도는 가상의 체크라인 (예: x가 700 이상 갔다가 200 이하로 오면 1바퀴)
    if(p1.x > 750) p1Passed = true;
    if(p1Passed && p1.x < 200) { p1.lap++; p1Passed = false; }

    if(p2.x > 750) p2Passed = true;
    if(p2Passed && p2.x < 200) { p2.lap++; p2Passed = false; }
}

function draw() {
    ctx.clearRect(0, 0, 900, 506);

    // 트랙 배경 (잔디와 아스팔트 느낌)
    ctx.fillStyle = "#0f172a"; ctx.fillRect(0, 0, 900, 506);

    // 중앙 트랙 아일랜드 (레이싱 서킷 느낌의 장애물 구조물)
    ctx.fillStyle = "#1e293b";
    ctx.beginPath();
    ctx.roundRect(250, 100, 400, 306, 40);
    ctx.fill();
    ctx.strokeStyle = "rgba(255,255,255,0.08)";
    ctx.lineWidth = 4;
    ctx.stroke();

    // 출발/결승선 표시선
    ctx.strokeStyle = "#facc15";
    ctx.lineWidth = 6;
    ctx.setLineDash([10, 10]);
    ctx.beginPath();
    ctx.moveTo(200, 80); ctx.lineTo(200, 230);
    ctx.stroke();
    ctx.setLineDash([]);

    // P1 차량 그리기 (회전 각도 계산)
    ctx.save();
    ctx.translate(p1.x, p1.y);
    let p1Angle = Math.atan2(p1.vy, p1.vx);
    if(Math.hypot(p1.vx, p1.vy) < 0.1) p1Angle = 0;
    ctx.rotate(p1Angle);
    ctx.fillStyle = p1.color;
    ctx.beginPath();
    ctx.roundRect(-22, -12, 44, 24, 6);
    ctx.fill();
    // 헤드라이트 & 바퀴 포인트
    ctx.fillStyle = "#ffffff"; ctx.fillRect(14, -8, 6, 4); ctx.fillRect(14, 4, 6, 4);
    ctx.restore();

    // P2 차량 그리기
    ctx.save();
    ctx.translate(p2.x, p2.y);
    let p2Angle = Math.atan2(p2.vy, p2.vx);
    if(Math.hypot(p2.vx, p2.vy) < 0.1) p2Angle = 0;
    ctx.rotate(p2Angle);
    ctx.fillStyle = p2.color;
    ctx.beginPath();
    ctx.roundRect(-22, -12, 44, 24, 6);
    ctx.fill();
    ctx.fillStyle = "#ffffff"; ctx.fillRect(14, -8, 6, 4); ctx.fillRect(14, 4, 6, 4);
    ctx.restore();
}

function loop() {
    update();
    checkLaps();
    draw();
    requestAnimationFrame(loop);
}

showMenu();
loop();
</script>
</body>
</html>
